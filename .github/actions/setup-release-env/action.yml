name: setup-release-env
description: Setup Node.js, Rust toolchain, and Rust cache for release jobs.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "22.22.0"
  npm-lock-path:
    description: Lockfile path used for npm cache.
    required: false
    default: |
      apps/package-lock.json
      .github/workflows/release-all.yml
  enable-npm-cache:
    description: Enable npm package cache through actions/setup-node.
    required: false
    default: "true"
  rust-toolchain:
    description: Rust toolchain channel.
    required: false
    default: stable
  enable-rust:
    description: Install Rust toolchain.
    required: false
    default: "true"
  rust-target:
    description: Optional Rust target triple.
    required: false
    default: ""
  rust-cache-shared-key:
    description: Shared rust-cache key.
    required: false
    default: release-all-platforms-rust-stable-v1
  enable-rust-cache:
    description: Enable rust-cache for Cargo registry and related caches.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: ${{ inputs.enable-npm-cache }}
        cache: npm
        cache-dependency-path: ${{ inputs.npm-lock-path }}

    - name: Setup Rust
      if: ${{ inputs.enable-rust == 'true' && inputs.rust-target == '' }}
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.rust-toolchain }}

    - name: Setup Rust target
      if: ${{ inputs.enable-rust == 'true' && inputs.rust-target != '' }}
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        targets: ${{ inputs.rust-target }}

    - name: Normalize Rust command paths
      if: ${{ inputs.enable-rust == 'true' && runner.os != 'Windows' }}
      shell: bash
      run: |
        set -euo pipefail

        cargo_path=""
        if command -v rustup >/dev/null 2>&1; then
          cargo_path="$(rustup which cargo 2>/dev/null || true)"
        fi

        if [ -z "$cargo_path" ]; then
          cargo_path="$(command -v cargo 2>/dev/null || true)"
        fi

        if [ -z "$cargo_path" ] || [ ! -x "$cargo_path" ]; then
          echo "usable cargo binary not found" >&2
          exit 1
        fi

        cargo_dir="$(dirname "$cargo_path")"
        cargo_version="$("$cargo_path" --version 2>&1)"
        case "$cargo_version" in
          cargo\ *) ;;
          *)
            echo "resolved cargo is not cargo: $cargo_path" >&2
            echo "$cargo_version" >&2
            exit 1
            ;;
        esac

        echo "$cargo_dir" >> "$GITHUB_PATH"
        echo "CARGO=$cargo_path" >> "$GITHUB_ENV"
        echo "$cargo_version"

    - name: Cache Rust dependencies
      if: ${{ inputs.enable-rust == 'true' && inputs.enable-rust-cache == 'true' }}
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.rust-cache-shared-key }}
        cache-targets: true
