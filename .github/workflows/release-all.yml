name: release-all

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.12)"
        required: true
        type: string
      ref:
        description: "Git ref/branch/sha to build"
        required: false
        default: "main"
        type: string
      prerelease:
        description: "Release channel override (auto/true/false)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - true
          - false

permissions:
  contents: write

env:
  TAURI_CLI_VERSION: 2.10.1
  CARGO_TARGET_DIR: ${{ github.workspace }}/target-shared

concurrency:
  group: ${{ format('{0}-tag-{1}', github.workflow, startsWith(github.event.inputs.tag, 'v') && github.event.inputs.tag || format('v{0}', github.event.inputs.tag)) }}
  cancel-in-progress: false

jobs:
  build_frontend_dist:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          enable-rust: "false"

      - name: Install frontend dependencies
        working-directory: apps
        run: npm ci

      - name: Build frontend dist
        working-directory: apps
        run: npm run build:desktop

      - name: Pack frontend dist artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/out/index.html || { echo "apps/out/index.html not found"; exit 1; }
          rm -f frontend-dist.tar.gz
          tar -czf frontend-dist.tar.gz -C apps out

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: codexmanager-frontend-dist
          path: frontend-dist.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  build_windows:
    needs: build_frontend_dist
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env

      - name: Prepare frontend dist
        uses: ./.github/actions/prepare-frontend-dist

      - name: Build Tauri bundle (with retry)
        uses: ./.github/actions/build-tauri-with-retry
        with:
          working-directory: apps
          tauri-cli-version: ${{ env.TAURI_CLI_VERSION }}
          bundles: nsis
          shell-type: pwsh

      - name: Stage desktop release assets
        shell: pwsh
        run: |
          $releaseDir = Join-Path "${{ env.CARGO_TARGET_DIR }}" "release"
          $portableDir = Join-Path $releaseDir "portable"
          $desktopAssetsDir = Join-Path $releaseDir "release-assets"
          $version = (Get-Content "apps/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $arch = if ("${{ runner.arch }}" -eq "ARM64") { "arm64" } else { "x64" }
          New-Item -ItemType Directory -Force $releaseDir | Out-Null
          New-Item -ItemType Directory -Force $portableDir | Out-Null
          Remove-Item -Recurse -Force $desktopAssetsDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $desktopAssetsDir | Out-Null

          $releaseDirs = @(
            $releaseDir,
            "apps/src-tauri/target/release",
            "apps/target/release"
          ) | Where-Object { Test-Path $_ -PathType Container } | Select-Object -Unique

          $releaseExeFiles = @(
            foreach ($dir in $releaseDirs) {
              Get-ChildItem -Path $dir -Recurse -File -Filter "*.exe" -ErrorAction SilentlyContinue
            }
          ) | Sort-Object FullName
          $releaseExeFiles | ForEach-Object {
            Write-Host "release exe: $($_.FullName)"
          }

          $portableCandidates = @(
            $releaseExeFiles | Where-Object {
              $_.FullName -notmatch '[\\/]bundle[\\/]' -and
              $_.FullName -notmatch '[\\/]release-assets[\\/]' -and
              $_.FullName -notmatch '[\\/]portable[\\/]' -and
              $_.Name -notlike "*setup.exe" -and
              $_.Name -notlike "*installer*.exe" -and
              $_.Name -notlike "Uninstall*.exe"
            }
          )

          $source = $null
          foreach ($name in @("CodexManager.exe", "codexmanager.exe", "Codex-Manager.exe", "codex-manager.exe")) {
            $source = $portableCandidates | Where-Object { $_.Name -ieq $name } | Select-Object -First 1
            if ($source) { break }
          }
          if (-not $source) {
            $source = $portableCandidates | Sort-Object FullName | Select-Object -First 1
          }
          $portableBinary = $null
          if ($source) {
            $portableBinary = Join-Path $portableDir "CodexManager-portable.exe"
            Copy-Item -Force $source.FullName $portableBinary
            Write-Host "portable binary: $portableBinary"
          } else {
            Write-Warning "portable source binary not found. searched release dirs: $($releaseDirs -join ', ')"
          }

          $bundleDirs = @(
            $releaseDirs | ForEach-Object { Join-Path $_ "bundle" }
          ) | Where-Object { Test-Path $_ -PathType Container }
          $installerSource = $null
          if (@($bundleDirs).Count -gt 0) {
            $installerSource = Get-ChildItem -Path $bundleDirs -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like "*-setup.exe" -and $_.Name -notlike "*portable*" } |
              Sort-Object FullName |
              Select-Object -First 1
          }
          if (-not $installerSource) {
            throw "windows setup installer not found under: $($bundleDirs -join ', ')"
          }

          $installerTarget = Join-Path $desktopAssetsDir "CodexManager_${version}_${arch}-setup.exe"
          Copy-Item -Force $installerSource.FullName $installerTarget
          if ($portableBinary) {
            Copy-Item -Force $portableBinary (Join-Path $desktopAssetsDir "CodexManager-portable.exe")
          }
          Get-ChildItem -Path $desktopAssetsDir -File | ForEach-Object {
            Write-Host "desktop asset: $($_.FullName)"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: codexmanager-windows
          path: ${{ env.CARGO_TARGET_DIR }}/release/release-assets/*.exe
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  build_windows_service:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-all-platforms-rust-stable-v1
          cache-targets: true

      - name: Build service binaries
        shell: pwsh
        run: |
          cargo build --release -p codexmanager-service -p codexmanager-web -p codexmanager-start

      - name: Stage service package
        uses: ./.github/actions/stage-service-package
        with:
          platform: windows
          arch: ${{ runner.arch == 'X64' && 'x86_64' || runner.arch == 'ARM64' && 'arm64' || runner.arch }}
          stage-root: stage
          release-dir: ${{ env.CARGO_TARGET_DIR }}/release
          binary-extension: .exe
          shell-type: pwsh

      - name: Upload service artifacts
        uses: actions/upload-artifact@v6
        with:
          name: codexmanager-service-windows
          path: stage/*.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    needs: [build_windows, build_windows_service]
    if: ${{ needs.build_windows.result == 'success' && needs.build_windows_service.result == 'success' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: codexmanager-*
          merge-multiple: true
          path: release-assets

      - name: List release assets
        run: find release-assets -type f | sort

      - name: Publish GitHub Release
        uses: ./.github/actions/publish-github-release
        with:
          tag: ${{ github.event.inputs.tag }}
          ref: ${{ github.event.inputs.ref || 'main' }}
          prerelease-input: ${{ github.event.inputs.prerelease || 'auto' }}
          assets-dir: release-assets
